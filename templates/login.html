<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
</head>
<body>

    <h1>Iniciar sesión</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Ingresar</button>
    </form>

    <p>¿Todavía no tienes una cuenta?</p>
    <a href="{% url 'register' %}">Registrarse</a>

</body>
</html>
