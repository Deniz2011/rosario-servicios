<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Enviar propuesta</title>
</head>
<body>

    <h1>Enviar una propuesta</h1>

    <h2>{{ service_request.title }}</h2>

    <p>{{ service_request.description }}</p>

    <form method="POST">
        {% csrf_token %}

        <label>Nombre y apellido:</label>
        <input type="text" name="provider_name" required>

        <br><br>

        <label>Correo electrónico:</label>
        <input type="email" name="provider_email" required>

        <br><br>

        <label>Precio de tu propuesta (ARS):</label>
        <input type="number" name="price" required>

        <br><br>

        <label>Mensaje:</label>
        <textarea name="message" required></textarea>

        <br><br>

        <button type="submit">Enviar propuesta</button>
    </form>

</body>
</html>
