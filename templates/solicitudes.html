<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitudes disponibles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Solicitudes disponibles</h1>

{% for request in requests %}

<div class="card">

    <h3>{{ request.title }}</h3>
    <p><strong>Categoría:</strong> {{ request.category }}</p>
    <p><strong>Cliente:</strong> {{ request.name }}</p>
    <p>🏠 {{ request.address }}</p>
    <p>💰 ${{ request.budget }}</p>
    <p>📍 {{ request.location }}</p>

    <p>{{ request.description }}</p>

    <a href="{% url 'request_detail' request.id %}">
    <button>Ver solicitud</button>
</a>

</div>

{% endfor %}
   
</body>
</html>
